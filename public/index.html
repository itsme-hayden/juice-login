<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Juice Shop Login Demo</title>
  <script src="/app.js" defer></script>
</head>
<body>
  <main>
    <h1>Hayden's Juice Shop</h1>
    <p>Coursework validation demo. Use a test password.</p>
    <form id="loginForm" novalidate>
      <p><label for="email">Email</label>
        <input id="email" name="email" type="text" inputmode="email" autocomplete="username" required></p>
      <p><label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" minlength="8" required></p>
      <button type="submit">Log in</button>
    </form>
    <p id="message" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
